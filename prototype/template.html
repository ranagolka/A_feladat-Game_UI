<title>A Feladat Beállítások</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Comic Neue — a teljes, OFL-licencű font beágyazva. A Google Fonts ehhez a családhoz csak a „latin" részhalmazt
   szolgálja ki (nincs latin-ext), így az Ő/Ű/ő/ű és a lengyel ą/ę/ł/ś/ż tartalékbetűre esne. Licenc: assets/OFL-ComicNeue.txt */
@font-face { font-family: "Comic Neue"; font-weight: 400; font-style: normal; font-display: block;
  src: url("__ASSET:ComicNeue-Regular.ttf__") format("truetype"); }
@font-face { font-family: "Comic Neue"; font-weight: 700; font-style: normal; font-display: block;
  src: url("__ASSET:ComicNeue-Bold.ttf__") format("truetype"); }
/* Elrendezés: egyetlen 1920×1080 játékvászon (a Figma referenciája), alatta a fejlesztői panel.
   Tokenek a Game UI Figma-változóiból. Szándékosan egytémás: a UI a világos LAP-on él (2.7, 09.07). */
:root {
  --paper: #f2f1eb;          /* LAP — ⚑ a végleges érték nyitott (2.7) */
  --ink: #020d34;            /* primary/contrast/main */
  --ink-soft: rgba(2,13,52,.5);   /* primary/border/light */
  --red: #bd0a1c;            /* secondary/contrast/main */
  --neutral: #4a4644;        /* neutral/contrast */
  --neutral-line: rgba(74,70,68,.5);
  --disabled: #aeaaa6;       /* primary/contrast/main-disabled */
  --scrim-warning: rgba(100,8,12,.9);   /* primary/surface/scrim-warning #64080C, 90% */
  --scrim-info: rgba(19,41,112,.9);     /* primary/surface/scrim-info #132970, 90% */
  --page: #e4e2da;           /* a vászon körüli asztallap */
  --font-ui: "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive; /* font-family/default (Figma) — DÖNTÉS 10.17 */
  --font-read: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-dev: "Inter", "Segoe UI", system-ui, sans-serif;
  --fs: 28px;                /* font-size/350 */
  --bw: 2px;                 /* border-width/semibold */
  color-scheme: light;
}
html, body { height: auto; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-dev);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.head h1 { margin: 0; font: 700 22px/1.2 var(--font-ui); letter-spacing: .02em; text-wrap: balance; }
.head p { margin: 0; font-size: 13px; color: var(--neutral); }

/* ---------- a vászon ---------- */
#viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden;
  box-shadow: 0 1px 0 rgba(2,13,52,.15), 0 12px 40px -18px rgba(2,13,52,.45); background: var(--paper); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
  font-family: var(--font-ui); font-size: var(--fs); color: var(--ink); background: var(--paper); overflow: hidden; }
#ui *, #ui *::before, #ui *::after { box-sizing: border-box; } /* a Figma-kód border-box méretezést feltételez */
#ui { position: absolute; inset: 0; font-family: var(--font-ui); font-size: var(--fs); }
#ui.readable { --font-ui: var(--font-read); --fs: 34px; }
#stage :focus { outline: none; } /* a fókuszt a forma jelzi: ">" + sraffozás + szín (4.1) */

/* Háttér — a Figma „UI-AUD-1-default" rétegei, a saját eszközeivel (assets/):
   papírcsempe 248 px · rácsmetszéspontok (4 × 56 px kar + 2 px pont) rombusz-maszkkal (közép 15%) ·
   topomap 12%-on, jobbra elforgatva · pageSideDecor a négy szélen. Passzerjel nincs. */
.paper { position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  background: var(--paper) url("__ASSET:paper.png__") repeat 0 0 / 248px 248px; }
.paper .masked { position: absolute; left: 0; top: 0; width: 1921px; height: 1081px;
  -webkit-mask: url("__ASSET:fade-mask.svg__") no-repeat 0 0 / 1921px 1081px; mask: url("__ASSET:fade-mask.svg__") no-repeat 0 0 / 1921px 1081px; }
.paper .grid { position: absolute; inset: 0; }
.paper .grid i { position: absolute; display: block; }
.paper .grid .av { width: .75px; height: 56px; background: url("__ASSET:grid-arm-v.svg__") no-repeat 0 0 / 100% 100%; transform: scaleY(-1); }
.paper .grid .ah { width: 56px; height: .75px; background: url("__ASSET:grid-arm-h.svg__") no-repeat 0 0 / 100% 100%; }
.paper .grid .dot { width: 2px; height: 2px; background: var(--neutral); }
.paper .topo-wrap { position: absolute; right: 0; top: 0; width: 591px; height: 1081px; display: flex; align-items: center; justify-content: center; }
.paper .topo { flex: none; position: relative; width: 1081px; height: 591px; opacity: .12; transform: rotate(-90deg); }
.paper .topo > div { position: absolute; inset: 0; overflow: hidden; }
.paper .topo img { position: absolute; left: -19.61%; top: 0; width: 119.61%; height: 123.02%; max-width: none; }
.side { position: absolute; display: block; max-width: none; }
.side-top { left: 60px; top: 0; width: 1800px; height: 48px; }
.side-bottom { left: 60px; bottom: 0; width: 1800px; height: 48px; }
.side-v { top: 60px; width: 48px; height: 960px; display: flex; align-items: center; justify-content: center; }
.side-v img { flex: none; width: 960px; height: 48px; max-width: none; }
.side-right { right: 0; } .side-right img { transform: rotate(90deg); }
.side-left { left: 0; }  .side-left img { transform: rotate(90deg) scaleY(-1); }

/* sraffozás — crosshatchActive: 192 px-es csempe, 48%-on, alapszín nélkül */
.hatch { position: relative; }
.hatch::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .48;
  background: url("__ASSET:crosshatch.png__") repeat 0 0 / 192px 192px; }
.hatch > :not(.frame):not(.ln):not(.shadow):not(.ctl-diagram) { position: relative; }

/* kézzel húzott tuskeret: a szegély külön rétegen, torzító szűrővel — a szöveg éles marad */
.frame { position: absolute; inset: 0; border: var(--bw) solid var(--ink-soft); pointer-events: none; filter: url(#rough); }

.screen { position: absolute; inset: 0; isolation: isolate; } /* saját rétegrend: az aktív fül z-indexe nem léphet a scrim fölé */
/* CategoryNavigation — x 60, y 60, 1800 széles: 120 px vezérlő · fülcsoport · 120 px vezérlő */
.navbar { position: absolute; top: 60px; left: 60px; width: 1800px; display: flex; align-items: flex-start; }
.navctl { flex: none; width: 120px; height: 60px; padding-top: 2px; display: flex; align-items: center; }
.navctl.lb { justify-content: flex-end; padding-right: 16px; }
.navctl.rb { padding-left: 16px; }
.bumper { position: relative; width: 75px; height: 38px; flex: none; }
.bumper img { position: absolute; left: 2px; top: 50%; width: 71px; height: 34px; transform: translateY(-50%); max-width: none; }
.bumper.rb img { transform: translateY(-50%) scaleX(-1); }
.bumper span { position: absolute; left: 0; right: 0; top: 28.95%; text-align: center;
  font: 700 24px/1 "Kalam", var(--font-ui); letter-spacing: .24px; color: #101030; } /* Controller/Small — a Figmában még Kalam */
.tabs { flex: 1; display: flex; min-width: 0; position: relative; }
.tab { position: relative; flex: 1 0 0; min-width: 0; min-height: 60px; display: flex; align-items: center; justify-content: center;
  padding: 18px 8px 14px; text-align: center; font-weight: 700; line-height: 28px; text-transform: uppercase;
  overflow-wrap: anywhere; hyphens: manual; }
/* kézzel húzott fülvonalak (a Figma SVG-i, nyújtva) */
.tab .ln { position: absolute; display: block; pointer-events: none; background-repeat: no-repeat; background-size: 100% 100%; }
.tab .ln-t { left: 0; right: 0; top: -.75px; height: 1.5px; background-image: url("__ASSET:tab-top.svg__"); }
.tab .ln-b { left: 0; right: 0; bottom: -.75px; height: 1.5px; background-image: url("__ASSET:tab-bottom.svg__"); transform: rotate(180deg); }
.tab .ln-r { top: -1px; bottom: -1px; right: -.75px; width: 1.5px; background-image: url("__ASSET:tab-right.svg__"); transform: scaleY(-1); }
.tab .ln-l { top: -1px; bottom: -1px; left: -.75px; width: 1.5px; background-image: url("__ASSET:tab-right.svg__"); }
.tab.is-active { color: var(--red); z-index: 1; }
.tab.is-active .ln-t { top: -1.5px; height: 3px; background-image: url("__ASSET:tab-top-active.svg__"); }
.tab.is-active .ln-b { bottom: -1.5px; height: 3px; background-image: url("__ASSET:tab-bottom-active.svg__"); }
.tab.is-active .ln-r { right: -1.5px; width: 3px; background-image: url("__ASSET:tab-side-active.svg__"); }
.tab.is-active .ln-l { left: -1.5px; width: 3px; background-image: url("__ASSET:tab-side-active.svg__"); }
/* active-menu-shadow: 8 px-es vonás, középvonala 3 px-re a fül alja alatt */
.tab .shadow { position: absolute; left: 0; right: 0; bottom: -7px; height: 8px; background: var(--red); }
.tab-label { position: relative; flex: 1 0 0; min-width: 0; }

.panel { position: absolute; top: 180px; left: 180px; right: 180px; bottom: 150px; display: flex; flex-direction: column; }
.row { position: relative; min-height: 120px; display: grid; grid-template-columns: 120px minmax(0, 1fr) 600px;
  align-items: center; padding-right: 120px; }
/* címke + leírás (Figma SettingsOption): a leírás a fókuszban is tinta, normál; a ">" az első sorhoz igazodik */
.row .text { grid-column: 2; max-width: 600px; position: relative; display: flex; flex-direction: column; min-width: 0; }
.row .marker { position: absolute; right: 100%; top: -2px; margin-right: 6px; visibility: hidden; color: var(--red); font-weight: 700; line-height: 1.15; }
.row .label { text-transform: uppercase; overflow-wrap: anywhere; line-height: 1.15; }
.row .text:has(.desc) :is(.label, .marker) { line-height: 28px; } /* Settings/OptionLabels: 28/28 */
.row .desc { font-size: 20px; line-height: 28px; font-weight: 400; color: var(--ink); overflow-wrap: anywhere; } /* Settings/Description */
#ui.readable .row .text:has(.desc) :is(.label, .marker) { line-height: 1.15; }
#ui.readable .row .desc { font-size: 24px; line-height: 1.3; }
.row.is-focused { color: var(--red); }
.row.is-focused .marker { visibility: visible; }
.row.is-focused .label { font-weight: 700; }
.row.is-disabled { color: var(--disabled); }
.control { display: flex; align-items: center; gap: 8px; }
.chev { width: 28px; flex: none; text-align: center; font-weight: 400; position: relative; top: -2px; } /* optikai középre */
.chev.is-off { color: var(--disabled); }
.row.is-focused .chev:not(.is-off) { font-weight: 700; } /* félkövér csak fókuszban; a letiltott mindig vékony, szürke */
/* meter — 10 egymáshoz illesztett szegmens: 1,5 px keret, 16 px magas, 4 px belső tér, a kitöltöttben 8 px-es sáv */
.meter { flex: 1; min-width: 0; display: flex; }
#ui .seg { flex: 1 0 0; min-width: 0; box-sizing: content-box; height: 8px; padding: 4px; border: 1.5px solid currentColor; }
/* középre igazított keret: a szomszédos szegmensek 1,5 px-es vonása fedi egymást, nem duplázódik */
#ui .seg + .seg { margin-left: -1.5px; }
.seg.on::after { content: ""; display: block; height: 8px; background: currentColor; }
/* a kitöltött/üres GEOMETRIA viszi a mennyiséget, nem csak a szín (spec 9.2) */
.row:not(.is-focused) .meter { color: var(--ink); }
/* bipolar-slider (Figma 22:3070) — 5 + 5 szegmens, köztük 42 px-es „I" középjel, mindkét oldalon −4 px átfedéssel */
.meter.bipolar { align-items: center; height: 28px; }
.meter.bipolar .half { flex: 1 0 0; min-width: 0; display: flex; }
.meter.bipolar .mid { flex: none; margin: 0 -4px; font-size: 42px; line-height: 28px; font-weight: 400; text-transform: uppercase; position: relative; z-index: 1; }
.value { white-space: nowrap; }

/* Előnézetes sor (Figma UI-GFX-1-default): 480 px magas, a címke és a csúszka a tetején marad (46 px, mint a 120 px-es sorban),
   alatta a kép (528×263) és a szürkeskála (528×71) a chevronok közé igazítva; 24 / 16 / 32 px-es közök */
.row.has-preview { align-items: start; padding-top: 46px; padding-bottom: 32px; }
.row.has-preview :is(.label, .marker) { line-height: 28px; } /* Settings/OptionLabels: 28/28 — így az első rács-sor 28 px, mint a csúszka */
#ui.readable .row.has-preview :is(.label, .marker) { line-height: 1.15; }
.row.has-preview .control { height: 28px; }
.gfx-preview { grid-column: 3; grid-row: 2; margin: 24px 36px 0; display: flex; flex-direction: column; gap: 16px; color: var(--ink); }
.gfx-pic, .gfx-scale { position: relative; box-sizing: border-box; padding: 5px; background: #f0f0ea; border: 3px solid var(--ink); } /* Figma: var(--paper, #f0f0ea), primary/border/main */
.gfx-pic { height: 263px; }
.gfx-pic > span { position: relative; display: block; height: 247px; overflow: hidden; }
.gfx-pic img { position: absolute; left: 0; top: -12.96%; width: 100%; height: 116.66%; max-width: none; }
.gfx-scale { height: 71px; }
.gfx-scale > span { display: flex; height: 55px; }
.gfx-scale i { flex: 1 0 0; min-width: 0; }
.gfx-pic img, .gfx-scale > span { filter: brightness(var(--gfx-brightness, 1)); }

/* Kiosztásábra (Figma UI-CON-1-default, 53:2283): a sor 600 px magas (300…900), az ábra kerete 1560×453 a sor tetejétől 133 px-re.
   Kép 673×449 (440, 4) · vonalak + pontok SVG 841×449 (359.5, 4) · Controllerlabel: 32 px jel + 8 px + 28/28 felirat */
.row.preview-controller { min-height: 600px; }
.ctl-diagram { position: absolute; left: 0; top: 133px; width: 1560px; height: 453px; color: var(--ink); pointer-events: none; }
.ctl-photo { position: absolute; left: 440px; top: 4px; width: 673px; height: 449px; max-width: none; }
.ctl-lines { position: absolute; left: 359.5px; top: 4px; width: 841px; height: 449px; max-width: none; }
.ctl-label { position: absolute; display: flex; align-items: center; gap: 8px; height: 32px; white-space: nowrap;
  font-weight: 400; line-height: 28px; text-transform: uppercase; }
.ctl-label.is-right { left: 1216px; }
.ctl-label.is-left { right: 1212px; }
.ctl-icon { position: relative; flex: none; width: 32px; height: 32px; }
.ctl-icon img { position: absolute; left: 0; top: 0; max-width: none; }
/* az export a renderelt határt adja: a kézzel rajzolt gyűrű ~1 px-rel kilóg a 32 px-es dobozból */
.ctl-system-menu img, .ctl-system-screen img { left: -1.02px; top: -1.03px; width: 35px; height: 34px; }
.ctl-stick-left img, .ctl-stick-right img { left: -.02px; width: 33px; height: 32px; }
.ctl-dpad-left img, .ctl-dpad-down img, .ctl-dpad-right img { width: 32px; height: 32px; }
.row.is-focused .value { font-weight: 700; }

.placeholder { margin: 60px 120px; max-width: 900px; color: var(--neutral); line-height: 1.35; }
.placeholder .ph-title { margin: 0 0 12px; color: var(--ink); font-weight: 700; font-size: 1.15em; }
.placeholder p { margin: 0; }

/* ActionBar — sima 1,5 px navy szegély, alul 60 px-re, 60 magas, px 40, gap 32 */
.actionbar { position: absolute; left: 180px; right: 180px; bottom: 60px; min-height: 60px; display: flex; align-items: center; justify-content: flex-end;
  padding: 0 40px; border: 1.5px solid var(--ink); }
.bar-items { position: relative; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 32px; }
/* ControllerButton (Figma 20:4891) — 32 px gombjel + felirat, 8 px rés; default navy · focused piros · disabled szürke */
.ctrl-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; line-height: 28px; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
.ctrl-btn.is-focused { color: var(--red); }
.ctrl-btn.is-disabled { color: var(--disabled); }
/* ControllerButton — 32 px-es kézzel rajzolt gyűrű, rajta a betű */
.glyph { position: relative; width: 32px; height: 32px; flex: none; display: inline-grid; place-items: center;
  font: 700 28px/28px var(--font-ui); }
.glyph img { position: absolute; left: -2.12%; top: -2.15%; width: 104.47%; height: 103.87%; max-width: none; }
.glyph b { position: relative; font-weight: 700; }

/* Modal (Figma 28:7907) — 840 × 288 alapméret, x 540 · y 220; a háttér inert, a fókusz a dialóguson */
.scrim { position: absolute; inset: 0; }
.scrim-warning { background: var(--scrim-warning); }
.scrim-info { background: var(--scrim-info); }
.modal { position: absolute; left: 540px; top: 220px; width: 840px; min-height: 288px; padding: 48px 40px 40px;
  display: flex; flex-direction: column; gap: 32px; outline: none; }
/* shadow: ugyanaz a crosshatch-csempe, két rétegben, ellentétes irányú vonalakkal */
.m-shadow1, .m-shadow2 { position: absolute; pointer-events: none; background: url("__ASSET:crosshatch.png__") repeat 0 0 / 192px 192px; }
.m-shadow1 { inset: 24px -24px -72px -24px; opacity: .8; transform: scaleX(-1); }
.m-shadow2 { inset: 40px -8px -32px -8px; }
.m-shadow-arrow { position: absolute; right: 24px; bottom: -88px; width: 48px; height: 56px; max-width: none; }
.m-paper { position: absolute; inset: 0; background: #f0f0ea; } /* Figma: var(--paper, #f0f0ea) */
.m-content { position: relative; display: flex; flex-direction: column; gap: 32px; min-height: 136px; } /* Figma: content 136 px */
.modal h2 { position: relative; width: fit-content; max-width: 100%; margin: 0; color: var(--red); font-size: 36px; line-height: 32px; font-weight: 700; text-transform: uppercase; } /* Modal/Title */
/* addon: a cím feletti 8 px-es piros sáv, a modal tetején (48 px = a felső padding), pontosan a cím szélességében */
.modal h2::before { content: ""; position: absolute; left: 0; right: 0; top: -48px; height: 8px; background: var(--red); }
.modal p { margin: 0; font-size: 28px; line-height: 36px; font-weight: 400; } /* Modal/Description */
#ui.readable .modal h2 { font-size: 42px; line-height: 1.1; }
#ui.readable .modal p { font-size: 34px; line-height: 1.3; }
.m-actions { position: relative; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px 32px; }
/* a Figma kézzel húzott kerete (28:7974): 846 × 293, a modalhoz képest (−3, −2.286); a dobozzal együtt nyúlik */
.m-border { position: absolute; left: -3px; top: -2.286px; width: calc(100% + 6px); height: calc(100% + 4.714px); pointer-events: none;
  background: url("__ASSET:modal-border.svg__") no-repeat 0 0 / 100% 100%; }
.m-arrow { position: absolute; right: 42px; bottom: -48px; width: 48px; height: 56px; max-width: none; }
.m-arrow-border { position: absolute; right: 39.24px; bottom: -52.92px; width: 51.32px; height: 62.28px; max-width: none; } /* 48×56 doboz, inset −2.43% −5.74% −8.79% −1.17% */

/* Nyitóoldal (Figma 1:678) — teljes képernyős illusztráció, világos pageSideDecor, bal oldali menü */
.start { position: absolute; inset: 0; overflow: hidden; color: #f9f8f8; } /* neutral/contrast/inverse/main */
.start-bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; max-width: none; object-fit: cover; object-position: bottom; }
.start-heading { margin: 0; font: inherit; }
.start-the { position: absolute; left: 313px; top: 145px; transform: translateX(-50%); margin: 0; white-space: nowrap; color: #fff;
  font-size: 28px; line-height: 28px; font-weight: 700; letter-spacing: 12.32px; text-transform: uppercase; } /* font-size/350 · line-height/350 */
.start-title { position: absolute; left: 96px; top: 203px; width: 430px; height: 77px; max-width: none; }
.start-logo-box { position: absolute; left: 313px; top: 320px; width: 72px; height: 102.947px; transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center; }
.start-logo { flex: none; width: 102.947px; height: 72px; max-width: none; transform: rotate(90deg); }
.start-credit { position: absolute; right: 96px; top: 942px; margin: 0; white-space: nowrap; color: #fff;
  font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.28px; text-transform: uppercase; }
/* menü: 432 széles elemek 120 px-es lépésközzel (y 557 · 677 · 797) */
.start-menu { position: absolute; left: 96px; top: 557px; width: 432px; display: grid; grid-auto-rows: 120px; align-items: start; }
.menu-item { position: relative; display: flex; align-items: flex-end; gap: 16px; padding: 24px 24px 24px 32px;
  border: 1.5px solid #f9f8f8; } /* border-width/regular · neutral/border/main-inverse */
.menu-item .mi-label { position: relative; flex: 1 0 0; min-width: 0; font-size: 32px; line-height: 1.2; font-weight: 700;
  letter-spacing: .64px; text-transform: uppercase; overflow-wrap: anywhere; }
.menu-item .mi-corner { position: relative; flex: none; width: 16px; height: 16px; }
.menu-item .mi-corner img { position: absolute; left: 0; top: 0; width: 16.75px; height: 16.75px; max-width: none; } /* inset 0 −4.69% −4.69% 0 */
/* fókusz: papírlap 3 px navy kerettel + két sraffozott árnyék (mint a modalnál), piros felirat szorzó módban */
.menu-item.is-focused { border: 0; color: #d01114; } /* Red */
